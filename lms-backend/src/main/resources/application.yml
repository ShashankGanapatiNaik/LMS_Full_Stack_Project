server:
  port: 8080

spring:
  application:
    name: lms-backend

  datasource:
    url: jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Shashank@2005
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: "ReplaceThisWithALongRandomBase64EncodedSecretKeyForJwtSigningPurposesOnly"
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    org.springframework.security: INFO
    com.lms: DEBUG
